name: Linux CPU aarch64

on:
  pull_request:
  push:
    branches:
      - nightly
      - main
      - release/*
    tags:
        - v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+
  schedule:
    # Nightly wheels are built from main and uploaded because trigger-event is
    # `schedule`, see _binary_upload.yml in pytorch/test-infra.
    - cron: '30 9 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_type == 'branch' && github.sha }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write

defaults:
  run:
    shell: bash -l -eo pipefail {0}

jobs:

  generate-matrix:
    uses: pytorch/test-infra/.github/workflows/generate_binary_build_matrix.yml@main
    with:
      package-type: wheel
      os: linux-aarch64
      test-infra-repository: pytorch/test-infra
      test-infra-ref: main
      # OSDC (ARC) runners: regular on pull requests, release-isolated on
      # main, nightly, release/* and v* tags.
      runner-fleet: osdc
      with-xpu: disable
      with-rocm: disable
      with-cuda: disable
      build-python-only: "disable"
      # Our wheels are tagged py3-none (see wheel.py-api in pyproject.toml) and
      # work on every Python version, so we only build them with one Python.
      # The install-and-test jobs download that single wheel by name, so keep
      # them in sync if this changes.
      python-versions: '["3.11"]'

  build:
    needs: generate-matrix
    strategy:
      fail-fast: false
    name: Build and Upload Linux aarch64 wheel
    uses: pytorch/test-infra/.github/workflows/build_wheels_linux.yml@main
    with:
      repository: meta-pytorch/torchcodec
      ref: ""
      test-infra-repository: pytorch/test-infra
      test-infra-ref: main
      build-matrix: ${{ needs.generate-matrix.outputs.matrix }}
      pre-script: packaging/pre_build_script.sh
      post-script: packaging/post_build_script.sh
      smoke-test-script: packaging/fake_smoke_test.py
      package-name: torchcodec
      trigger-event: ${{ github.event_name }}
      architecture: aarch64
      build-platform: "python-build-package"
      build-command: "BUILD_AGAINST_ALL_FFMPEG_FROM_S3=1 python -m build --wheel -vvv --no-isolation"

  install-and-test:
    runs-on: mt-l-arm64g3-16-62
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']
        ffmpeg-version-for-tests: ['7']
    # OSDC runners have no host toolchain; the job runs in this image, as the
    # CUDA aarch64 workflow already does with its builder image.
    container:
      image: "pytorch/manylinux2_28_aarch64-builder:cpu-aarch64"
    needs: build
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Remove src/ folder
        run: bash packaging/remove_src.sh

      - name: Setup conda env
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          # Using miniforge instead of miniconda ensures that the default
          # conda channel is conda-forge instead of main/default. This ensures
          # ABI consistency between dependencies:
          # https://conda-forge.org/docs/user/transitioning_from_defaults/
          miniforge-version: latest
          activate-environment: test
          python-version: ${{ matrix.python-version }}

      - name: Update pip
        run: python -m pip install --upgrade pip

      - name: Install PyTorch
        run: bash packaging/install_pytorch.sh cpu "torch torchvision"

      - uses: actions/download-artifact@v4
        with:
          name: meta-pytorch_torchcodec__3.11_cpu_aarch64
          path: dist/

      - name: Install torchcodec from the wheel
        run: bash packaging/install_torchcodec_wheel.sh

      - name: Install ffmpeg, post build
        # In the container, conda's FFmpeg libs need to be on LD_LIBRARY_PATH, as in
        # the CUDA aarch64 workflow.
        run: |
          bash packaging/install_ffmpeg.sh ${{ matrix.ffmpeg-version-for-tests }}
          echo LD_LIBRARY_PATH=$CONDA_PREFIX/lib:${LD_LIBRARY_PATH} >> $GITHUB_ENV

      - name: Install test dependencies
        run: bash packaging/install_test_dependencies.sh ${{ matrix.ffmpeg-version-for-tests != '4' && matrix.ffmpeg-version-for-tests != '5' }}

      - name: Run Python smoke tests
        run: |
          if [ "${{ matrix.ffmpeg-version-for-tests }}" = "4" ] || [ "${{ matrix.ffmpeg-version-for-tests }}" = "5" ]; then export FAIL_WITHOUT_HEIC=0; fi
          python packaging/assert_ffmpeg_version.py ${{ matrix.ffmpeg-version-for-tests }}
          FAIL_WITHOUT_IMAGE_CODECS=1 pytest --override-ini="addopts=-v" test/smoke_test.py --tb=short

      - name: Run Python tests
        if: ${{ matrix.ffmpeg-version-for-tests == '7' && !startsWith(github.ref, 'refs/heads/release/') }}
        run: |
          if [ "${{ matrix.ffmpeg-version-for-tests }}" = "4" ] || [ "${{ matrix.ffmpeg-version-for-tests }}" = "5" ]; then export FAIL_WITHOUT_HEIC=0; fi
          python packaging/assert_ffmpeg_version.py ${{ matrix.ffmpeg-version-for-tests }}
          FAIL_WITHOUT_IMAGE_CODECS=1 pytest --override-ini="addopts=-v" test
