name: Docs

on:
  push:
    branches:
      - main
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      # Pushed by pytorch-bot for the ciflow/docs label, which the labeler adds to
      # PRs touching docs/ or src/. This runs in this repo, so fork PRs can upload
      # a preview too.
      - ciflow/docs/*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_type == 'branch' && github.sha }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

defaults:
  run:
    shell: bash -l -eo pipefail {0}

jobs:
  generate-matrix:
    uses: pytorch/test-infra/.github/workflows/generate_binary_build_matrix.yml@main
    with:
      package-type: wheel
      os: linux
      test-infra-repository: pytorch/test-infra
      test-infra-ref: main
      runner-fleet: osdc
      with-cpu: disable
      with-xpu: disable
      with-rocm: disable
      with-cuda: enable
      python-versions: '["3.11"]'

  filter-matrix:
    needs: generate-matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - id: filter
        env:
          MATRIX: ${{ needs.generate-matrix.outputs.matrix }}
        # build-docs installs only this wheel; keep in sync with its CUDA_VERSION.
        run: |
          echo "matrix=$(jq -c '{include: [.include[] | select(.desired_cuda == "cu132")]}' <<< "${MATRIX}")" >> "${GITHUB_OUTPUT}"

  build:
    needs: filter-matrix
    strategy:
      fail-fast: false
    name: Build wheel
    uses: pytorch/test-infra/.github/workflows/build_wheels_linux.yml@main
    with:
      repository: meta-pytorch/torchcodec
      ref: ""
      test-infra-repository: pytorch/test-infra
      test-infra-ref: main
      build-matrix: ${{ needs.filter-matrix.outputs.matrix }}
      pre-script: packaging/pre_build_script.sh
      post-script: packaging/post_build_script.sh
      smoke-test-script: packaging/fake_smoke_test.py
      package-name: torchcodec
      trigger-event: ${{ github.event_name }}
      build-platform: "python-build-package"
      build-command: "BUILD_AGAINST_ALL_FFMPEG_FROM_S3=1 ENABLE_CUDA=1 python -m build --wheel -vvv --no-isolation"

  build-docs:
    runs-on: mt-l-x86aavx2-11-41-a10g
    env:
      PYTHON_VERSION: '3.11'
      CUDA_VERSION: '13.2'
      FFMPEG_VERSION: '7'
    container:
      image: "pytorch/manylinux2_28-builder:cuda13.2"  # must be same as env!!
      options: "--gpus all -e NVIDIA_DRIVER_CAPABILITIES=video,compute,utility"
    needs: build
    steps:
      - name: Setup env vars
        run: |
          cuda_version_without_periods=$(echo "${{ env.CUDA_VERSION }}" | sed 's/\.//g')
          echo cuda_version_without_periods=${cuda_version_without_periods} >> $GITHUB_ENV

      - name: Check out repo
        uses: actions/checkout@v6

      - name: Remove src/ folder
        run: bash packaging/remove_src.sh

      - name: Setup miniconda using test-infra
        uses: pytorch/test-infra/.github/actions/setup-miniconda@main
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # We install conda packages at the start because otherwise conda may have conflicts with dependencies.
          default-packages: "conda-forge::cuda-version=${{ env.CUDA_VERSION }} conda-forge::cuda-nvrtc conda-forge::cuda-cudart conda-forge::cuda-driver-dev conda-forge::ffmpeg=${{ env.FFMPEG_VERSION }}"
      - name: Check env, set LD_LIBRARY_PATH
        run: |
          ${CONDA_RUN} env
          ${CONDA_RUN} conda info
          ${CONDA_RUN} nvidia-smi
          ${CONDA_RUN} conda list
          echo LD_LIBRARY_PATH=$CONDA_PREFIX/lib:/usr/local/cuda/lib64/:${LD_LIBRARY_PATH} >> $GITHUB_ENV
      - name: Assert ffmpeg exists
        run: |
          ${CONDA_RUN} ffmpeg -buildconf
      - name: Update pip
        run: ${CONDA_RUN} python -m pip install --upgrade pip
      - name: Install PyTorch
        run: |
          ${CONDA_RUN} bash packaging/install_pytorch.sh cu${{ env.cuda_version_without_periods }} "torch torchvision"
          ${CONDA_RUN} python -c 'import torch; print(f"{torch.__version__}"); print(f"{torch.__file__}"); print(f"{torch.cuda.is_available()=}")'

      - uses: actions/download-artifact@v4
        with:
          name: meta-pytorch_torchcodec__3.11_cu${{ env.cuda_version_without_periods }}_x86_64
          path: dist/

      - name: Install torchcodec from the wheel
        run: ${CONDA_RUN} bash packaging/install_torchcodec_wheel.sh "*cu${{ env.cuda_version_without_periods }}-py3-none*.whl"

      - name: Install doc dependencies
        run: |
          cd docs
          ${CONDA_RUN} python -m pip install -r requirements.txt
      - name: Build docs
        run: |
          cd docs
          ${CONDA_RUN} make html
      - uses: actions/upload-artifact@v4
        with:
          name: Built-Docs
          path: docs/build/html/

  doc-preview:
    runs-on: mt-l-x86iavx512-8-64
    container:
      image: docker.io/python:3.11-slim
    needs: build-docs
    if: github.repository == 'meta-pytorch/torchcodec' && startsWith(github.ref, 'refs/tags/ciflow/docs/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Built-Docs
          path: docs

      # Update HTML to add the no-index tag so that search engines do not index these ephemeral docs
      - name: Add no-index tag
        run: |
          find docs -name "*.html" -print0 | xargs -0 sed -i '/<head>/a \ \ <meta name="robots" content="noindex">';

      - name: Get the PR number
        id: pr
        run: echo "number=${GITHUB_REF_NAME##*/}" >> "${GITHUB_OUTPUT}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::308535385114:role/arc
          aws-region: us-east-1

      - name: Upload docs preview
        uses: seemethere/upload-artifact-s3@v5
        with:
          retention-days: 14
          s3-bucket: doc-previews
          if-no-files-found: error
          path: docs
          s3-prefix: meta-pytorch/torchcodec/${{ steps.pr.outputs.number }}

  upload-docs:
    # This job uploads built docs:
    # - to the `main` folder of the gh-pages branch (https://meta-pytorch.org/torchcodec/main) on every commit to the `main` branch
    # - to the (e.g.) `0.10` folder in the gh-pages branch whenever a corresponding tag is pushed, like `v0.10.0` (https://meta-pytorch.org/torchcodec/0.10).

    needs: build-docs
    permissions:
      contents: write
    if: github.repository == 'meta-pytorch/torchcodec' && github.event_name == 'push' &&
        ((github.ref_type == 'branch' && github.ref_name == 'main') ||
         (github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-rc')))
    runs-on: ubuntu-latest
    steps:
      - name: Check out gh-pages branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages

      - uses: actions/download-artifact@v4
        with:
          name: Built-Docs
          path: docs-artifact/

      - name: Update docs and push
        run: |
          set -euo pipefail

          REF_TYPE=${{ github.ref_type }}
          REF_NAME=${{ github.ref_name }}

          if [[ "${REF_TYPE}" == branch ]]; then
            TARGET_FOLDER="${REF_NAME}"
          elif [[ "${REF_TYPE}" == tag ]]; then
            # Strip the leading "v" as well as the trailing patch version. For example:
            # 'v0.10.2' -> '0.10'
            TARGET_FOLDER=$(echo "${REF_NAME}" | sed 's/v\([0-9]\+\)\.\([0-9]\+\)\.[0-9]\+/\1.\2/')
          fi
          echo "Target Folder: ${TARGET_FOLDER}"

          mkdir -p "${TARGET_FOLDER}"
          rm -rf "${TARGET_FOLDER}"/*
          cp -r docs-artifact/* "${TARGET_FOLDER}/"
          git add "${TARGET_FOLDER}"

          git config user.name 'pytorchbot'
          git config user.email 'soumith+bot@pytorch.org'
          git commit -m "auto-generating sphinx docs for ${TARGET_FOLDER}" || echo "No changes to commit"
          git push
